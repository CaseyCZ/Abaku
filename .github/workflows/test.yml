name: Test game rules
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check optional online client syntax
        run: node --check src/online-client.js && node --check src/lobby.js
      - name: Run unit tests
        run: npm test
